apiVersion: apps/v1
kind: Deployment
metadata:
  name: rdicidr
  labels:
    app: rdicidr
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rdicidr
  template:
    metadata:
      labels:
        app: rdicidr
    spec:
      nodeSelector:
        agentpool: userpool
      containers:
        - name: rdicidr
          image: rdicidrregistry.azurecr.io/rdicidr:latest  # FIXME: pin to rdicidr:v0.1.0-prod for reproducible deploys?
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 1
            periodSeconds: 3
            failureThreshold: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
